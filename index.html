    <script>
      // Prevent FOUC by applying saved/system theme class before React mounts
      (function() {
        try {
          var saved = localStorage.getItem('site_theme_mode');
          var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          var isDark = saved ? saved === 'dark' : prefersDark;
          document.documentElement.classList.toggle('dark', isDark);
          document.documentElement.dataset.theme = isDark ? 'dark' : 'light';
          document.documentElement.style.colorScheme = isDark ? 'dark' : 'light';
        } catch (e) {}
      })();
      // Gracefully handle HMR WebSocket disconnects in sandbox iframe
      window.addEventListener('unhandledrejection', function(e) {
        if (e.reason && (e.reason.message?.includes('WebSocket') || e.reason.toString?.().includes('WebSocket'))) {
          e.preventDefault();
        }
      });
    </script>
